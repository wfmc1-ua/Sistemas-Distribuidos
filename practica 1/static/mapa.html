<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Drones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f8f8f8; /* Fondo claro para estética */
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 50px; /* Espacio superior para cabecera invisible */
            margin-bottom: 50px; /* Espacio inferior para pie de página invisible */
        }
        table {
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        td, th {
            border: 1px solid black;
            width: 30px;
            height: 30px;
            text-align: center;
            vertical-align: middle;
        }
        .dron-run {
            background-color: #FF3636;
        }
        .dron-end {
            background-color: #0BF103;
        }
        .completado {
            background-color: #ECB872;
            border: 2px solid #C8934C;
            border-radius: 2px;
            padding: 10px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }
        .header-space {
            height: 50px; /* Altura del espacio superior */
        }
        .footer-space {
            height: 50px; /* Altura del espacio inferior */
        }
    </style>
</head>
<body>
<div class="header-space"></div> <!-- Espacio superior -->
<div class="container">
    <h1>******** ART WITH DRONES ********</h1>
    <div id="completado" class="completado" style="display: none;">FIGURA COMPLETADA</div>
    <table id="tablero"></table>
    <div id="estado"></div> <!-- Contenedor para el mensaje de estado -->
</div>
<div class="footer-space"></div> <!-- Espacio inferior -->

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tablero = document.getElementById('tablero');
        const estadoDiv = document.getElementById('estado'); // Referencia al contenedor del mensaje de estado
        const completadoDiv = document.getElementById('completado'); // Referencia al contenedor de la frase "FIGURA COMPLETADA"

        // Función para actualizar el contenido del tablero HTML
        function actualizarTablero(data) {
            tablero.innerHTML = ''; // Limpia el tablero actual

            // Crear fila de encabezado con números de columna
            const headerRow = document.createElement('tr');
            const emptyHeaderCell = document.createElement('th');
            headerRow.appendChild(emptyHeaderCell);
            for (let i = 1; i <= data[0].length; i++) {
                const headerCell = document.createElement('th');
                headerCell.innerText = i;
                headerRow.appendChild(headerCell);
            }
            tablero.appendChild(headerRow);

            // Itera sobre cada fila del tablero recibido
            data.forEach((fila, i) => {
                const row = document.createElement('tr'); // Crea una nueva fila en la tabla
                const headerCell = document.createElement('th');
                headerCell.innerText = i + 1; // Agrega el número de la fila
                row.appendChild(headerCell);

                // Itera sobre cada celda de la fila
                fila.forEach((celda, j) => {
                    const cell = document.createElement('td'); // Crea una nueva celda en la tabla

                    if (celda.trim() === 'x' || celda.trim() === '') {
                        // Si la celda está vacía en el JSON, la celda en la tabla HTML se mantiene vacía
                        cell.innerText = '';
                    } else {
                        // Separamos los drones en la celda
                        const drones = celda.split(', ');
                        // Elegimos el primer dron de la lista (o podríamos elegir uno al azar)
                        const [dronId, estado] = drones[0].split(' (');
                        cell.innerText = dronId; // Asigna el ID del dron como texto de la celda
                        const estadoLimpio = estado.replace(')', ''); // Limpia el estado quitando el paréntesis

                        // Aplica una clase CSS a la celda basada en el estado del dron
                        if (estadoLimpio === 'RUN') {
                            cell.classList.add('dron-run'); // Colorea de rojo si el estado es RUN
                        } else if (estadoLimpio === 'END') {
                            cell.classList.add('dron-end'); // Colorea de verde si el estado es END
                        }
                    }
                    row.appendChild(cell); // Agrega la celda a la fila
                });

                // Asegurar que todas las filas tengan el mismo número de celdas, incluso si están vacías
                for (let j = fila.length; j < data[0].length; j++) {
                    const cell = document.createElement('td');
                    cell.innerText = '';
                    row.appendChild(cell);
                }

                tablero.appendChild(row); // Agrega la fila completa al tablero
            });
        }

        // Función para obtener el tablero desde el servidor
        function obtenerTablero() {
            fetch('/get-tablero') // Realiza una solicitud GET al endpoint '/get-tablero'
                .then(response => response.json()) // Convierte la respuesta a JSON
                .then(data => {
                    if (data.status === 'success') {
                        actualizarTablero(data.data); // Actualiza el tablero con los datos recibidos
                    } else {
                        console.error('Error al obtener el tablero:', data.message); // Muestra el error en la consola
                    }
                })
                .catch(error => console.error('Error en la conexión:', error)); // Maneja cualquier error en la solicitud
        }

        // Función para obtener el estado del espectáculo desde el servidor
        function obtenerEstado() {
            fetch('/get-estado') // Realiza una solicitud GET al endpoint '/get-estado'
                .then(response => response.json()) // Convierte la respuesta a JSON
                .then(data => {
                    if (data.status === 'success') {
                        let mensaje = `Figura ${data.figuraNumero}: `;
                        switch (data.estado) {
                            case 'INICIAL':
                                mensaje += 'Espacio inicial sin ningún dron. Espectáculo no iniciado';
                                completadoDiv.style.display = 'none'; // Oculta el rectángulo
                                break;
                            case 'AUTENTIFICANDO':
                                mensaje += 'Drones esperando al comienzo del espectáculo.';
                                completadoDiv.style.display = 'none'; // Oculta el rectángulo
                                break;
                            case 'EN_CURSO':
                                mensaje += 'Espectáculo en curso. Drones posicionándose';
                                completadoDiv.style.display = 'none'; // Oculta el rectángulo
                                break;
                            case 'COMPLETADO':
                                mensaje += 'Figura completada. Drones en espera de nuevas instrucciones';
                                completadoDiv.style.display = 'block'; // Muestra el rectángulo
                                break;
                            default:
                                mensaje += 'Estado desconocido';
                                completadoDiv.style.display = 'none'; // Oculta el rectángulo
                        }
                        estadoDiv.innerText = mensaje; // Actualiza el contenedor del estado con el mensaje
                    } else {
                        console.error('Error al obtener el estado:', data.message); // Muestra el error en la consola
                    }
                })
                .catch(error => console.error('Error en la conexión:', error)); // Maneja cualquier error en la solicitud
        }

        // Llama a la función obtenerTablero y obtenerEstado cada 5 segundos para actualizar el tablero y el estado periódicamente
        setInterval(() => {
            obtenerTablero();
            obtenerEstado();
        }, 5000);

        // Llama inicialmente para cargar los datos cuando se carga la página
        obtenerTablero();
        obtenerEstado();
    });
</script>
</body>
</html>
