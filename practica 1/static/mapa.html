<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Drones</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        table {
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            width: 30px;
            height: 30px;
            text-align: center;
            vertical-align: middle;
        }
        .dron-run {
            background-color: red;
        }
        .dron-end {
            background-color: green;
        }
    </style>
</head>
<body>
<div class="container">
    <table id="tablero"></table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tablero = document.getElementById('tablero');

        // Función para actualizar el contenido del tablero HTML
        function actualizarTablero(data) {
            tablero.innerHTML = ''; // Limpia el tablero actual

            // Itera sobre cada fila del tablero recibido
            data.forEach((fila, i) => {
                const row = document.createElement('tr'); // Crea una nueva fila en la tabla

                // Itera sobre cada celda de la fila
                fila.forEach((celda, j) => {
                    const cell = document.createElement('td'); // Crea una nueva celda en la tabla

                    if (celda.trim() === 'x') {
                        // Si la celda está vacía en el JSON, la celda en la tabla HTML se mantiene vacía
                        cell.innerText = '';
                    } else {
                        // Separamos el contenido de la celda en ID del dron y su estado
                        const [dronId, estado] = celda.split(' (');
                        cell.innerText = dronId; // Asigna el ID del dron como texto de la celda
                        const estadoLimpio = estado ? estado.replace(')', '') : '';

                        // Aplica una clase CSS a la celda basada en el estado del dron
                        if (estadoLimpio === 'RUN') {
                            cell.classList.add('dron-run'); // Colorea de rojo si el estado es RUN
                        } else if (estadoLimpio === 'END') {
                            cell.classList.add('dron-end'); // Colorea de verde si el estado es END
                        }
                    }
                    row.appendChild(cell); // Agrega la celda a la fila
                });

                tablero.appendChild(row); // Agrega la fila completa al tablero
            });
        }

        // Función para obtener el tablero desde el servidor
        function obtenerTablero() {
            fetch('/get-tablero') // Realiza una solicitud GET al endpoint '/get-tablero'
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Error en la respuesta del servidor');
                    }
                })
                .then(data => {
                    if (data.status === 'success') {
                        actualizarTablero(data.data); // Actualiza el tablero con los datos recibidos
                    } else {
                        console.error('Error al obtener el tablero:', data.message); // Muestra el error en la consola
                    }
                })
                .catch(error => console.error('Error en la conexión:', error)); // Maneja cualquier error en la solicitud
        }

        // Llama a la función obtenerTablero cada 5 segundos para actualizar el tablero periódicamente
        obtenerTablero(); // Llama inmediatamente para cargar el tablero al inicio
        setInterval(obtenerTablero, 5000);
    });
</script>
</body>
</html>
