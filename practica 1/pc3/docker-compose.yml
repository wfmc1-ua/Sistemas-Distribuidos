services:
  python-app:
    image: python:3.9-slim
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install cryptography requests kafka-python colorama  && 
      python AD_Drone.py 0.0.0.0:4444 0.0.0.0:2222 0.0.0.0:3333 192.168.1.143:9093"
    ports:
      - 4444:4444
    stdin_open: true # Añadir esta línea
    tty: true        # Añadir esta línea
  